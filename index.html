<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Word">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Daily Word</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #f6f1e7;
    --bg-elevated: #fbf7ef;
    --ink: #2b2418;
    --ink-soft: #6c5f47;
    --ink-faint: #a8987b;
    --rule: #e6dcc8;
    --accent: #8a3a1f;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 32px rgba(60,42,12,.06);
    --serif: "Iowan Old Style", "Palatino Linotype", "Palatino", "Georgia", ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --reading-size: 1.18rem;
    --line-height: 1.78;
    --measure: 34rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13110d;
      --bg-elevated: #1c1812;
      --ink: #ece3cf;
      --ink-soft: #b6a988;
      --ink-faint: #75694e;
      --rule: #2c261c;
      --accent: #d98c63;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f1e7; --bg-elevated: #fbf7ef; --ink: #2b2418; --ink-soft: #6c5f47;
    --ink-faint: #a8987b; --rule: #e6dcc8; --accent: #8a3a1f;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 32px rgba(60,42,12,.06);
  }
  :root[data-theme="dark"] {
    --bg: #13110d; --bg-elevated: #1c1812; --ink: #ece3cf; --ink-soft: #b6a988;
    --ink-faint: #75694e; --rule: #2c261c; --accent: #d98c63;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-size: var(--reading-size);
    line-height: var(--line-height);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern", "liga", "onum";
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px;
    background: linear-gradient(to bottom, var(--bg) 70%, transparent);
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .crest-btn {
    background: none; border: 0; padding: 4px 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .crest {
    font-family: var(--sans); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
  }
  .iconbtn {
    background: none; border: 0; padding: 8px; cursor: pointer;
    color: var(--ink-soft); border-radius: 999px;
    transition: background .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .iconbtn:hover, .iconbtn:focus-visible { background: var(--rule); color: var(--ink); outline: 0; }
  .iconbtn svg { display: block; width: 22px; height: 22px; }

  /* ---------- Main reading column ---------- */
  main {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 0 24px 96px;
  }
  .heading-block { text-align: center; padding: 18px 0 32px; }
  .back-to-today {
    display: inline-block;
    font-family: var(--sans); font-size: 10.5px;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-soft); text-decoration: none; font-weight: 600;
    padding: 7px 14px; margin: 0 0 18px;
    background: var(--bg-elevated); border: 1px solid var(--rule);
    border-radius: 999px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .15s, color .15s;
  }
  .back-to-today:hover, .back-to-today:focus-visible {
    border-color: var(--ink-soft); color: var(--ink); outline: 0;
  }
  .date-line {
    font-family: var(--sans); font-size: 12px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
  }
  .feast-line {
    font-family: var(--serif); font-style: italic;
    font-size: 1.45rem; line-height: 1.3;
    color: var(--ink); margin-top: 10px;
    letter-spacing: -0.005em;
  }

  /* ---------- Each passage ---------- */
  .passage { margin: 44px 0; }
  .passage:first-of-type { margin-top: 0; }
  .passage-ref {
    font-family: var(--sans); font-size: 12px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--accent); font-weight: 700;
    text-align: center; margin-bottom: 8px;
  }
  .passage-title {
    font-family: var(--serif); font-style: italic;
    text-align: center; color: var(--ink-soft);
    font-size: 1rem; margin: 0 0 22px;
  }
  .passage-body p { margin: 0 0 1em; }
  .passage-body { hyphens: auto; -webkit-hyphens: auto; }
  .passage-body .v {
    font-family: var(--sans); font-size: 0.62em;
    vertical-align: 0.4em; color: var(--ink-faint);
    margin: 0 0.2em 0 0; font-weight: 600;
    font-feature-settings: "lnum";
  }
  .passage-body .verse-num {
    font-family: var(--sans); font-size: 0.62em;
    vertical-align: 0.4em; color: var(--ink-faint);
    margin: 0 0.2em 0 0; font-weight: 600;
  }
  .passage-body .p { margin: 0 0 1em; }
  .passage-body .q, .passage-body .q1 { margin: 0 0 0.4em 1.5em; text-indent: -0.7em; }
  .passage-body .q2 { margin: 0 0 0.4em 2.5em; text-indent: -0.7em; }
  .passage-body .b { height: 0.7em; }
  .passage-body .nd { font-variant: small-caps; letter-spacing: 0.04em; }
  .passage-body .wj { color: var(--accent); }
  .passage-body h1, .passage-body h2, .passage-body h3,
  .passage-body .s, .passage-body .s1, .passage-body .s2 { display: none; }

  .ornament {
    text-align: center; color: var(--ink-faint);
    margin: 18px 0; font-size: 1.1rem; letter-spacing: 1em;
  }
  .ornament::before { content: "❦"; }

  .state {
    text-align: center; color: var(--ink-soft);
    padding: 80px 24px; max-width: 28rem; margin: 0 auto;
    font-family: var(--sans); font-size: 0.95rem;
  }
  .state .title {
    font-family: var(--serif); font-style: italic; font-size: 1.4rem;
    color: var(--ink); margin-bottom: 14px;
  }
  .state button {
    margin-top: 18px;
    background: var(--ink); color: var(--bg);
    border: 0; padding: 12px 22px; border-radius: 999px;
    font-family: var(--sans); font-size: 0.92rem; font-weight: 600;
    letter-spacing: .04em; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .skeleton {
    background: linear-gradient(90deg, var(--rule), var(--bg-elevated), var(--rule));
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
    border-radius: 4px; height: 1em; margin: 0.4em 0;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  /* ---------- Bottom sheet (menu) ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: var(--bg-elevated); color: var(--ink);
    border-top-left-radius: 22px; border-top-right-radius: 22px;
    box-shadow: var(--shadow);
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    max-height: 90vh; overflow-y: auto;
    padding: 8px 24px calc(28px + env(safe-area-inset-bottom));
  }
  .sheet.open { transform: translateY(0); }
  .sheet .grabber {
    width: 38px; height: 4px; background: var(--rule);
    border-radius: 2px; margin: 8px auto 14px;
  }

  /* Menu sections */
  .sheet h3 {
    font-family: var(--sans); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
    margin: 26px 0 8px;
  }
  .sheet h3:first-of-type { margin-top: 6px; }

  /* Theme + size segmented controls */
  .seg {
    display: flex; background: var(--bg); border: 1px solid var(--rule);
    border-radius: 10px; padding: 3px; gap: 3px; margin-top: 8px;
  }
  .seg button {
    flex: 1; background: transparent; border: 0; cursor: pointer;
    padding: 9px 0; border-radius: 8px;
    font-family: var(--sans); font-size: 14px; color: var(--ink-soft);
    -webkit-tap-highlight-color: transparent;
  }
  .seg button[aria-pressed="true"] {
    background: var(--ink); color: var(--bg);
  }
  .display-row { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 12px; margin: 12px 0; }
  .display-row span {
    font-family: var(--sans); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-soft); font-weight: 600;
  }

  /* Reading list */
  .reading-list { list-style: none; padding: 0; margin: 0; }
  .reading-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0; cursor: pointer;
    padding: 13px 4px; border-bottom: 1px solid var(--rule);
    font-family: var(--serif); color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    transition: background .12s;
  }
  .reading-item:active { background: var(--rule); }
  .reading-item:last-child { border-bottom: 0; }
  .reading-item .ri-row { display: flex; align-items: baseline; gap: 8px; }
  .reading-item .ri-today {
    font-family: var(--sans); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent); font-weight: 700;
  }
  .reading-item .ri-date {
    font-family: var(--serif); font-size: 1.02rem; line-height: 1.3;
  }
  .reading-item .ri-feast {
    display: block; font-style: italic; font-size: 0.86rem;
    color: var(--ink-soft); margin-top: 2px;
  }
  .reading-item.current .ri-date { color: var(--accent); }
  .reading-item.current .ri-feast { color: var(--accent); opacity: 0.85; }
  .reading-empty {
    font-family: var(--sans); font-size: 0.9rem; color: var(--ink-soft);
    padding: 14px 4px;
  }

  .credit {
    text-align: center; margin: 60px 24px 0;
    font-family: var(--sans); font-size: 11px; letter-spacing: .12em;
    color: var(--ink-faint); text-transform: uppercase;
  }

  body[data-size="s"] { --reading-size: 1.0rem; --measure: 32rem; }
  body[data-size="m"] { --reading-size: 1.18rem; --measure: 34rem; }
  body[data-size="l"] { --reading-size: 1.34rem; --measure: 36rem; }
  body[data-size="xl"] { --reading-size: 1.5rem; --measure: 38rem; }
</style>
</head>
<body>

<header class="topbar">
  <button class="crest-btn" id="btnHome" aria-label="Today's reading">
    <span class="crest">Daily Word</span>
  </button>
  <button class="iconbtn" id="btnMenu" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
</header>

<main id="main">
  <div class="heading-block">
    <button class="back-to-today" id="backToToday" hidden>← Back to today</button>
    <div class="date-line" id="dateLine"></div>
    <div class="feast-line" id="feastLine">Loading today's readings…</div>
  </div>
  <div id="content">
    <div class="passage">
      <div class="passage-ref skeleton" style="width: 8em; margin: 0 auto 22px"></div>
      <div class="passage-body">
        <div class="skeleton" style="width: 96%"></div>
        <div class="skeleton" style="width: 88%"></div>
        <div class="skeleton" style="width: 92%"></div>
        <div class="skeleton" style="width: 70%"></div>
      </div>
    </div>
  </div>
  <div class="credit" id="credit"></div>
</main>

<!-- Menu sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>

  <h3 id="sheetTitle">Recent readings</h3>
  <ul class="reading-list" id="readingList">
    <li class="reading-empty">Loading…</li>
  </ul>

  <h3>Display</h3>
  <div class="display-row">
    <span>Theme</span>
    <div class="seg" id="themeSeg" role="group" aria-label="Theme">
      <button data-theme="auto" aria-pressed="true">Auto</button>
      <button data-theme="light" aria-pressed="false">Light</button>
      <button data-theme="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
  <div class="display-row">
    <span>Size</span>
    <div class="seg" id="sizeSeg" role="group" aria-label="Text size">
      <button data-size="s" aria-pressed="false">S</button>
      <button data-size="m" aria-pressed="true">M</button>
      <button data-size="l" aria-pressed="false">L</button>
      <button data-size="xl" aria-pressed="false">XL</button>
    </div>
  </div>
</aside>

<script>
/* =====================================================================
   Daily Word — distraction-free RCL daily reading PWA (CSB via API.Bible)
   All API access goes through ./api.php on the same origin. The API.Bible
   key and Bible ID live server-side — they never reach the client.
   ===================================================================== */

(() => {
  'use strict';

  // ---------- Config ----------
  // The single backend endpoint. Same-origin → no CORS, no key in client code.
  const API_PATH = './api.php';
  const STORE_KEY = 'dailyword.settings.v2';

  // ---------- Settings (display only) ----------
  const settings = loadSettings();
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      return Object.assign({ theme: 'auto', size: 'm' }, s);
    } catch { return { theme: 'auto', size: 'm' }; }
  }
  function saveSettings() { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); }

  // ---------- App state ----------
  const state = {
    allItems: [],            // parsed RSS items, sorted desc by pubDate
    defaultItemKey: null,    // what we land on by default (today if available, else most recent past)
    todayCalendarKey: null,  // pubDate of an item whose date literally matches today's local calendar — null if feed hasn't caught up
    currentItemKey: null,    // pubDate of the item currently displayed
  };

  // ---------- DOM refs ----------
  const $ = sel => document.querySelector(sel);
  const dateLine     = $('#dateLine');
  const feastLine    = $('#feastLine');
  const backToToday  = $('#backToToday');
  const content      = $('#content');
  const credit       = $('#credit');
  const sheet        = $('#sheet');
  const sheetBackdrop= $('#sheetBackdrop');
  const themeSeg     = $('#themeSeg');
  const sizeSeg      = $('#sizeSeg');
  const readingList  = $('#readingList');

  // ---------- Theme & size ----------
  function applyTheme(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    [...themeSeg.querySelectorAll('button')].forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.theme === t ? 'true' : 'false'));
  }
  function applySize(s) {
    document.body.setAttribute('data-size', s);
    [...sizeSeg.querySelectorAll('button')].forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.size === s ? 'true' : 'false'));
  }
  themeSeg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    settings.theme = b.dataset.theme; saveSettings(); applyTheme(settings.theme);
  });
  sizeSeg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    settings.size = b.dataset.size; saveSettings(); applySize(settings.size);
  });
  applyTheme(settings.theme);
  applySize(settings.size);

  // ---------- Sheet open/close ----------
  function openSheet() {
    renderReadingList();
    sheet.classList.add('open');
    sheetBackdrop.classList.add('open');
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheetBackdrop.classList.remove('open');
  }
  $('#btnMenu').addEventListener('click', openSheet);
  sheetBackdrop.addEventListener('click', closeSheet);
  $('#btnHome').addEventListener('click', () => { viewToday(); });
  backToToday.addEventListener('click', () => { viewToday(); });

  // ---------- Date helpers ----------
  function parsePubDate(s) {
    if (!s) return null;
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function isSameLocalDay(a, b) {
    return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
  }

  const MONTH_NAMES = [
    'january','february','march','april','may','june',
    'july','august','september','october','november','december'
  ];

  // Extract the reading's actual calendar date from the item title.
  // Titles look like "Daily Readings for Wednesday, April 29, 2026" or
  // "Easter Sunday — April 5, 2026". The date in the title represents the day
  // the reading is FOR — which is what we care about. pubDate is just the
  // publish timestamp and can fall on the previous local day if Vanderbilt
  // publishes late at night and the user is west of the feed's timezone.
  function parseDateFromTitle(title) {
    if (!title) return null;
    const decoded = String(title)
      .replace(/&amp;/g, '&').replace(/&#8211;/g, '–').replace(/&#8212;/g, '—');
    const m = decoded.match(/([A-Za-z]+)\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/);
    if (!m) return null;
    const month = MONTH_NAMES.indexOf(m[1].toLowerCase());
    if (month < 0) return null;
    const day = parseInt(m[2], 10);
    const year = parseInt(m[3], 10);
    if (!day || !year) return null;
    return new Date(year, month, day, 12, 0, 0); // noon local — DST-safe
  }

  // Best source of truth for what calendar day a reading is for.
  function getReadingDate(item) {
    return parseDateFromTitle(item && item.title) || parsePubDate(item && item.pubDate);
  }
  function fmtLongUpper(d) {
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  function fmtMenuDate(d) {
    const sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString(undefined,
      sameYear ? { weekday: 'long', month: 'long', day: 'numeric' }
               : { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  // ---------- RSS feed (via api.php) ----------
  async function fetchFeed() {
    const resp = await fetch(API_PATH + '?action=feed', { cache: 'no-store' });
    if (!resp.ok) {
      const body = await resp.text().catch(() => '');
      throw new Error(`feed HTTP ${resp.status}${body ? ': ' + body.slice(0,160) : ''}`);
    }
    return await resp.text();
  }

  function parseFeed(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('Could not parse RSS feed.');
    const items = [...doc.querySelectorAll('item')].map(it => ({
      title: text(it, 'title'),
      pubDate: text(it, 'pubDate'),
      link: text(it, 'link'),
      description: text(it, 'description'),
      content: it.getElementsByTagNameNS('http://purl.org/rss/1.0/modules/content/', 'encoded')[0]?.textContent || '',
    }));
    return items;
    function text(parent, tag) {
      const el = parent.getElementsByTagName(tag)[0];
      return el ? el.textContent.trim() : '';
    }
  }

  // STRICT: an item whose reading-date is today's local date, or null.
  function pickTodayCalendarItem(items) {
    const today = new Date();
    for (const it of items) {
      const d = getReadingDate(it);
      if (d && isSameLocalDay(d, today)) return it;
    }
    return null;
  }
  // Today's match if it exists; otherwise the most recent past item.
  // This is what we land on when the user opens the app or taps "Back to today".
  function pickDefaultItem(items) {
    const today = new Date();
    const strict = pickTodayCalendarItem(items);
    if (strict) return strict;
    const past = items
      .map(it => ({ it, d: getReadingDate(it) }))
      .filter(x => x.d && x.d <= today)
      .sort((a, b) => b.d - a.d);
    if (past.length) return past[0].it;
    return items[0];
  }

  // ---------- Title cleaner (avoids redundant date headings) ----------
  function cleanTitle(rawTitle) {
    let t = (rawTitle || '').replace(/&amp;/g, '&').replace(/&#8211;/g, '–').replace(/&#8212;/g, '—').trim();
    t = t.replace(/^\s*Daily Readings\s+for\s+/i, '').trim();
    const WEEKDAY = '(?:Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)';
    const dateOnly = new RegExp('^(?:' + WEEKDAY + ',\\s+)?[A-Za-z]+\\s+\\d{1,2}(?:st|nd|rd|th)?,?\\s+\\d{4}\\.?$');
    if (dateOnly.test(t)) return '';
    const trailingDate = new RegExp('[,\\s—–\\-]+(?:' + WEEKDAY + ',\\s+)?[A-Za-z]+\\s+\\d{1,2}(?:st|nd|rd|th)?,?\\s+\\d{4}\\.?$');
    return t.replace(trailingDate, '').trim();
  }

  // ---------- Bible book → USFM mapping ----------
  const BOOK_NAMES = [
    "Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth",
    "1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther",
    "Job","Psalm","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Song of Songs","Canticles",
    "Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah",
    "Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi",
    "Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians",
    "Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians",
    "1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter",
    "1 John","2 John","3 John","Jude","Revelation"
  ];
  const BOOK_USFM = {
    "Genesis":"GEN","Exodus":"EXO","Leviticus":"LEV","Numbers":"NUM","Deuteronomy":"DEU",
    "Joshua":"JOS","Judges":"JDG","Ruth":"RUT","1 Samuel":"1SA","2 Samuel":"2SA",
    "1 Kings":"1KI","2 Kings":"2KI","1 Chronicles":"1CH","2 Chronicles":"2CH",
    "Ezra":"EZR","Nehemiah":"NEH","Esther":"EST","Job":"JOB","Psalm":"PSA","Psalms":"PSA",
    "Proverbs":"PRO","Ecclesiastes":"ECC","Song of Solomon":"SNG","Song of Songs":"SNG","Canticles":"SNG",
    "Isaiah":"ISA","Jeremiah":"JER","Lamentations":"LAM","Ezekiel":"EZK","Daniel":"DAN",
    "Hosea":"HOS","Joel":"JOL","Amos":"AMO","Obadiah":"OBA","Jonah":"JON","Micah":"MIC",
    "Nahum":"NAM","Habakkuk":"HAB","Zephaniah":"ZEP","Haggai":"HAG","Zechariah":"ZEC","Malachi":"MAL",
    "Matthew":"MAT","Mark":"MRK","Luke":"LUK","John":"JHN","Acts":"ACT","Romans":"ROM",
    "1 Corinthians":"1CO","2 Corinthians":"2CO","Galatians":"GAL","Ephesians":"EPH",
    "Philippians":"PHP","Colossians":"COL","1 Thessalonians":"1TH","2 Thessalonians":"2TH",
    "1 Timothy":"1TI","2 Timothy":"2TI","Titus":"TIT","Philemon":"PHM","Hebrews":"HEB",
    "James":"JAS","1 Peter":"1PE","2 Peter":"2PE","1 John":"1JN","2 John":"2JN","3 John":"3JN",
    "Jude":"JUD","Revelation":"REV"
  };
  const bookAlt = BOOK_NAMES.slice().sort((a,b) => b.length - a.length).map(n => n.replace(/ /g, '\\s+')).join('|');
  const REF_REGEX = new RegExp(
    '\\b(' + bookAlt + ')\\s+(\\d+(?::\\d+(?:[a-c])?)?(?:[\\u2013\\u2014\\-]\\s*\\d+(?::\\d+(?:[a-c])?)?)?(?:\\s*,\\s*\\d+(?::\\d+(?:[a-c])?)?(?:[\\u2013\\u2014\\-]\\s*\\d+(?::\\d+(?:[a-c])?)?)?)*)',
    'g'
  );

  function extractRefsFromHtml(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = (html || '').replace(/<\/(p|li|div|br|h[1-6])>/gi, '$&\n').replace(/<br\s*\/?>/gi, '\n');
    const text = tmp.textContent || '';
    const found = [];
    const seen = new Set();
    REF_REGEX.lastIndex = 0;
    let m;
    while ((m = REF_REGEX.exec(text)) !== null) {
      const book = normalizeBook(m[1]);
      if (!book) continue;
      const ref = `${book} ${m[2].replace(/\s+/g, ' ')}`.replace(/\s+,/g, ',');
      if (!seen.has(ref)) { seen.add(ref); found.push(ref); }
    }
    return found;
  }
  function normalizeBook(s) {
    const compact = s.replace(/\s+/g, ' ').trim();
    if (BOOK_USFM[compact]) return compact;
    return BOOK_NAMES.find(n => n.toLowerCase() === compact.toLowerCase()) || null;
  }

  function refToPassageIds(ref) {
    const m = ref.match(new RegExp('^(' + bookAlt + ')\\s+(.+)$'));
    if (!m) return [];
    const book = normalizeBook(m[1]);
    if (!book) return [];
    const usfm = BOOK_USFM[book];
    const segs = m[2].split(/\s*,\s*/);
    const out = [];
    let lastChapter = null;

    for (const seg of segs) {
      const s = seg.replace(/[–—]/g, '-').trim();
      const stripParts = (x) => x.replace(/[a-c]\b/g, '');
      const ranged = stripParts(s).split(/\s*-\s*/);
      function parsePart(p) {
        if (!p) return null;
        const cv = p.split(':');
        if (cv.length === 2) return { chapter: +cv[0], verse: +cv[1] };
        return { chapter: null, verse: +cv[0] };
      }
      const a = parsePart(ranged[0]);
      const b = ranged[1] ? parsePart(ranged[1]) : null;
      let startChap, startVerse, endChap, endVerse;

      if (a) {
        if (a.chapter !== null) { startChap = a.chapter; startVerse = a.verse; lastChapter = a.chapter; }
        else if (lastChapter !== null) { startChap = lastChapter; startVerse = a.verse; }
        else { startChap = a.verse; startVerse = null; lastChapter = startChap; }
      }
      if (b) {
        if (b.chapter !== null) { endChap = b.chapter; endVerse = b.verse; lastChapter = b.chapter; }
        else { endChap = startChap; endVerse = b.verse; }
      } else { endChap = startChap; endVerse = startVerse; }

      let passageId;
      if (startVerse == null && endVerse == null) {
        passageId = `${usfm}.${startChap}`;
      } else if (startVerse != null && endVerse == null) {
        passageId = `${usfm}.${startChap}.${startVerse}`;
      } else if (startChap === endChap && startVerse === endVerse) {
        passageId = `${usfm}.${startChap}.${startVerse}`;
      } else {
        passageId = `${usfm}.${startChap}.${startVerse}-${usfm}.${endChap}.${endVerse}`;
      }
      out.push({ passageId, label: `${book} ${seg}`.trim() });
    }
    return out;
  }

  // ---------- Passage fetch (via api.php) ----------
  async function fetchPassage(passageId) {
    const url = API_PATH + '?action=passage&id=' + encodeURIComponent(passageId);
    const resp = await fetch(url);
    if (!resp.ok) {
      const body = await resp.text().catch(() => '');
      throw new Error(`HTTP ${resp.status}${body ? ': ' + body.slice(0,140) : ''}`);
    }
    const data = await resp.json();
    return data.data;
  }

  // ---------- Render: state messages ----------
  function renderState({ title, body, action }) {
    feastLine.style.display = '';
    feastLine.textContent = '';
    content.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'state';
    if (title) {
      const t = document.createElement('div');
      t.className = 'title'; t.textContent = title; wrap.appendChild(t);
    }
    if (body) {
      const parts = String(body).split(/\n\s*\n/);
      for (const part of parts) {
        const p = document.createElement('div');
        p.style.marginBottom = '0.8em';
        p.textContent = part;
        wrap.appendChild(p);
      }
    }
    if (action) {
      const b = document.createElement('button'); b.textContent = action.label;
      b.addEventListener('click', action.fn); wrap.appendChild(b);
    }
    content.appendChild(wrap);
  }

  // ---------- Render: heading + back-to-today affordance ----------
  function renderHeading(item) {
    const d = getReadingDate(item) || new Date();
    dateLine.textContent = fmtLongUpper(d);
    const title = cleanTitle(item.title);
    if (title) {
      feastLine.textContent = title;
      feastLine.style.display = '';
    } else {
      feastLine.textContent = '';
      feastLine.style.display = 'none';
    }
    // Hide "Back to today" when the user is on the default view (whether or not
    // that view's date literally matches today — feeds publish on their own schedule).
    const isDefault = state.defaultItemKey && item.pubDate === state.defaultItemKey;
    backToToday.hidden = isDefault;
  }

  // ---------- Render: a single item's readings ----------
  async function viewItem(item) {
    state.currentItemKey = item.pubDate;
    closeSheet();
    window.scrollTo({ top: 0, behavior: 'auto' });
    renderHeading(item);

    content.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const sk = document.createElement('div');
      sk.className = 'passage';
      sk.innerHTML = `
        <div class="passage-ref skeleton" style="width:8em; margin:0 auto 22px"></div>
        <div class="passage-body">
          <div class="skeleton" style="width:96%"></div>
          <div class="skeleton" style="width:88%"></div>
          <div class="skeleton" style="width:92%"></div>
          <div class="skeleton" style="width:70%"></div>
        </div>`;
      content.appendChild(sk);
    }

    const haystack = item.content || item.description || '';
    let refs = extractRefsFromHtml(haystack);
    if (!refs.length) refs = extractRefsFromHtml(item.title || '');

    content.innerHTML = '';

    if (!refs.length) {
      renderState({
        title: 'No references found',
        body: "This day's lectionary entry didn't contain a recognizable scripture reference.",
        action: item.link ? { label: 'Open lectionary page', fn: () => { location.href = item.link; } } : null,
      });
      return;
    }

    for (let i = 0; i < refs.length; i++) {
      const ref = refs[i];
      const segs = refToPassageIds(ref);
      if (!segs.length) continue;

      const sect = document.createElement('section');
      sect.className = 'passage';
      const refEl = document.createElement('div');
      refEl.className = 'passage-ref'; refEl.textContent = ref;
      sect.appendChild(refEl);
      const bodyEl = document.createElement('div');
      bodyEl.className = 'passage-body';
      sect.appendChild(bodyEl);
      content.appendChild(sect);

      for (const s of segs) {
        try {
          const data = await fetchPassage(s.passageId);
          const html = (data && data.content) || '';
          const piece = document.createElement('div');
          piece.innerHTML = html;
          while (piece.firstChild) bodyEl.appendChild(piece.firstChild);
        } catch (err) {
          const e = document.createElement('p');
          e.style.color = 'var(--ink-faint)';
          e.style.fontStyle = 'italic';
          e.textContent = `(Could not load ${s.label}: ${err.message})`;
          bodyEl.appendChild(e);
        }
      }
      if (i < refs.length - 1) {
        const orn = document.createElement('div');
        orn.className = 'ornament';
        content.appendChild(orn);
      }
    }
    credit.textContent = 'CSB · Lectionary by Vanderbilt Library';
  }

  // ---------- Top-level: load feed + view today (or a specific item) ----------
  async function loadFeedIfNeeded() {
    if (state.allItems.length) return;
    const xml = await fetchFeed();
    // Sort by reading-date desc (more reliable than pubDate across timezones).
    const items = parseFeed(xml).filter(it => getReadingDate(it));
    items.sort((a, b) => getReadingDate(b) - getReadingDate(a));
    state.allItems = items;
    const strict = pickTodayCalendarItem(items);
    state.todayCalendarKey = strict ? strict.pubDate : null;
    const def = pickDefaultItem(items);
    state.defaultItemKey = def ? def.pubDate : null;
  }

  async function viewToday() {
    feastLine.style.display = '';
    feastLine.textContent = "Loading today's readings…";
    backToToday.hidden = true;

    try {
      await loadFeedIfNeeded();
    } catch (err) {
      renderState({
        title: "Couldn't load today's readings",
        body: err.message + '\n\nIf this persists, try again in a moment, or check that ./api.php is reachable on your server.',
        action: { label: 'Try again', fn: viewToday }
      });
      return;
    }

    if (!state.allItems.length) {
      renderState({ title: 'Lectionary feed is empty', body: 'The RSS feed returned no items.' });
      return;
    }

    const def = state.allItems.find(it => it.pubDate === state.defaultItemKey) || state.allItems[0];
    await viewItem(def);
  }

  async function viewItemByKey(key) {
    const item = state.allItems.find(it => it.pubDate === key);
    if (!item) return viewToday();
    await viewItem(item);
  }

  // ---------- Menu rendering ----------
  function renderReadingList() {
    if (!state.allItems.length) {
      readingList.innerHTML = '<li class="reading-empty">No readings loaded yet.</li>';
      return;
    }
    readingList.innerHTML = '';
    for (const item of state.allItems) {
      const d = getReadingDate(item);
      if (!d) continue;
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'reading-item';
      btn.type = 'button';
      if (item.pubDate === state.currentItemKey) btn.classList.add('current');

      // The "TODAY" badge appears only when an item's pubDate literally matches
      // today's calendar — never on a fallback "most recent" item.
      const isToday = state.todayCalendarKey && item.pubDate === state.todayCalendarKey;
      const row = document.createElement('div');
      row.className = 'ri-row';
      if (isToday) {
        const tag = document.createElement('span');
        tag.className = 'ri-today';
        tag.textContent = 'Today';
        row.appendChild(tag);
      }
      const dateEl = document.createElement('span');
      dateEl.className = 'ri-date';
      dateEl.textContent = fmtMenuDate(d);
      row.appendChild(dateEl);
      btn.appendChild(row);

      const feast = cleanTitle(item.title);
      if (feast) {
        const feastEl = document.createElement('span');
        feastEl.className = 'ri-feast';
        feastEl.textContent = feast;
        btn.appendChild(feastEl);
      }

      btn.addEventListener('click', () => viewItemByKey(item.pubDate));
      li.appendChild(btn);
      readingList.appendChild(li);
    }
  }

  // ---------- Service worker ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // ---------- Boot ----------
  viewToday();

})();
</script>
</body>
</html>
