<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e7"/>
      <stop offset="100%" stop-color="#e6d8be"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f1e6cb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Open book -->
  <g transform="translate(56,128)">
    <!-- spine shadow -->
    <path d="M200 24 L200 296" stroke="#b59a6a" stroke-width="4" stroke-linecap="round"/>
    <!-- left page -->
    <path d="M16 40
             C 80 8, 160 8, 200 24
             L 200 296
             C 160 280, 80 280, 16 312 Z"
          fill="url(#page)" stroke="#b59a6a" stroke-width="4" stroke-linejoin="round"/>
    <!-- right page -->
    <path d="M384 40
             C 320 8, 240 8, 200 24
             L 200 296
             C 240 280, 320 280, 384 312 Z"
          fill="url(#page)" stroke="#b59a6a" stroke-width="4" stroke-linejoin="round"/>
    <!-- text lines (left) -->
    <g stroke="#8a7651" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="50"  y1="80"  x2="178" y2="62"/>
      <line x1="50"  y1="108" x2="178" y2="92"/>
      <line x1="50"  y1="136" x2="178" y2="122"/>
      <line x1="50"  y1="164" x2="158" y2="152"/>
      <line x1="50"  y1="192" x2="178" y2="180"/>
      <line x1="50"  y1="220" x2="170" y2="210"/>
    </g>
    <!-- text lines (right) -->
    <g stroke="#8a7651" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="222" y1="62"  x2="350" y2="80"/>
      <line x1="222" y1="92"  x2="350" y2="108"/>
      <line x1="222" y1="122" x2="350" y2="136"/>
      <line x1="222" y1="152" x2="332" y2="164"/>
      <line x1="222" y1="180" x2="350" y2="192"/>
      <line x1="222" y1="210" x2="342" y2="220"/>
    </g>
    <!-- Cross atop -->
    <g transform="translate(176,-72)">
      <rect x="20" y="0" width="8" height="64" rx="2" fill="#8a3a1f"/>
      <rect x="0" y="20" width="48" height="8" rx="2" fill="#8a3a1f"/>
    </g>
  </g>
</svg>
